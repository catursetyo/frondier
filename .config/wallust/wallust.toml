# wallust 3.x — palette → kitty / zathura / rmpc / neopywal
# (trimmed 2026-10-18: only consumers that still exist after the niri migration)

# How the image is parsed to get the colors:
backend = "kmeans"
color_space = "labmixed"
palette = "dark"
check_contrast = true
threshold = 11

[templates]
kitty.template = 'colors-kitty.conf'
kitty.target = '~/.config/kitty/kitty-colors.conf'

zathura.template = 'colors-zathura'
zathura.target = '~/.config/zathura/zathurarc'

rmpc = { template = 'rmpc.ron', target = '~/.config/rmpc/themes/wallust.ron'}

neopywal.template = "colors_neopywal.vim"
neopywal.target = "~/.cache/wallust/colors_neopywal.vim"
